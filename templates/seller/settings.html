{% extends "seller/seller_base.html" %}

{% block content %}
<div style="background: white; border: 1px solid var(--border-color); padding: 2rem; border-radius: 8px; max-width: 600px;">
    <h2 style="margin-top: 0; color: var(--color-primary); margin-bottom: 1.5rem;">Store Settings</h2>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <p style="color: var(--color-primary); background: var(--color-cream); padding: 1rem; margin-bottom: 2rem; border-radius: 4px;">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('seller.store_settings') }}" method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 1.5rem;">
        
        <div>
            <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Store Logo</label>
            {% if seller.store_logo %}
                <img src="{{ url_for('static', filename='images/' + seller.store_logo) }}" alt="Current Logo" style="width: 80px; height: 80px; object-fit: cover; border-radius: 50%; margin-bottom: 1rem; border: 2px solid var(--border-color);">
            {% endif %}
            <input type="file" name="store_logo" accept="image/*" style="width: 100%;">
        </div>

        <div>
            <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Store Name</label>
            <input type="text" name="name" value="{{ seller.name }}" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; font-family: var(--font-body); box-sizing: border-box; border-radius: 4px;">
        </div>
        
        <div>
            <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Store Description (About Us)</label>
            <textarea name="store_description" rows="5" placeholder="Tell customers about your craftsmanship and heritage..." style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; font-family: var(--font-body); box-sizing: border-box; border-radius: 4px;">{{ seller.store_description or '' }}</textarea>
        </div>
        
        <button type="submit" class="btn-solid-primary" style="margin-top: 1rem; width: fit-content;">Save Changes</button>
    </form>
</div>
{% endblock %}
