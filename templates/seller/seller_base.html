<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Tribal Handicraft</title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/logo.jpg') }}">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --sidebar-width: 250px;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--color-white);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
        }
        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }
        .sidebar-header img {
            max-height: 50px;
            margin-bottom: 0.5rem;
        }
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }
        .sidebar-menu li {
            border-bottom: 1px solid #f0f0f0;
        }
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            color: var(--color-text);
            text-decoration: none;
            transition: all 0.3s;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: var(--color-cream);
            color: var(--color-primary);
            border-left: 4px solid var(--color-primary);
        }
        .sidebar-menu i {
            font-size: 1.2rem;
        }
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 2rem;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .kpi-card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .kpi-icon {
            font-size: 2.5rem;
            color: var(--color-primary);
            background: var(--color-cream);
            padding: 1rem;
            border-radius: 8px;
        }
        .kpi-data h4 {
            margin: 0;
            color: var(--color-text-muted);
            font-size: 0.9rem;
        }
        .kpi-data h2 {
            margin: 0;
            color: var(--color-primary);
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="{{ url_for('static', filename='images/new_logo.png') }}" alt="Logo">
            <h3 style="margin: 0; font-size: 1rem; color: var(--color-primary);">Seller Center</h3>
        </div>
        <ul class="sidebar-menu">
            <li><a href="{{ url_for('seller.dashboard') }}" class="{{ 'active' if request.endpoint == 'seller.dashboard' else '' }}"><i class="ph ph-squares-four"></i> Dashboard</a></li>
            <li><a href="{{ url_for('seller.add_product') }}" class="{{ 'active' if request.endpoint == 'seller.add_product' else '' }}"><i class="ph ph-plus-circle"></i> Add Product</a></li>
            <li><a href="{{ url_for('seller.my_products') }}" class="{{ 'active' if request.endpoint == 'seller.my_products' else '' }}"><i class="ph ph-package"></i> My Products</a></li>
            <li><a href="{{ url_for('seller.orders') }}" class="{{ 'active' if request.endpoint == 'seller.orders' else '' }}"><i class="ph ph-shopping-bag"></i> Orders & Delivery</a></li>
            <li><a href="{{ url_for('seller.earnings') }}" class="{{ 'active' if request.endpoint == 'seller.earnings' else '' }}"><i class="ph ph-chart-line-up"></i> Sales & Earnings</a></li>
            <li><a href="{{ url_for('seller.store_settings') }}" class="{{ 'active' if request.endpoint == 'seller.store_settings' else '' }}"><i class="ph ph-gear"></i> Store Settings</a></li>
        </ul>
        <div style="padding: 1.5rem;">
            <a href="{{ url_for('auth.logout') }}" class="btn-solid-primary" style="display: block; text-align: center; width: 100%; box-sizing: border-box;"><i class="ph ph-sign-out"></i> Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="dashboard-header">
            <h2 style="margin: 0; color: var(--color-primary);">Welcome Back!</h2>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <a href="{{ url_for('storefront.seller_store', seller_id=session['user_id']) }}" target="_blank" style="color: var(--color-primary); text-decoration: underline; font-weight: bold;">View Live Store</a>
            </div>
        </div>

        {% block content %}{% endblock %}
    </main>

</body>
</html>
