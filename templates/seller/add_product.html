{% extends "seller/seller_base.html" %}

{% block content %}
<div style="max-width: 800px;">
    <h2 style="color: var(--color-primary); margin-bottom: 2rem;">Add New Product</h2>
    
    <div style="background: white; border: 1px solid var(--border-color); padding: 3rem; border-radius: 8px;">
        <form action="{{ url_for('seller.add_product') }}" method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 1.5rem;">
            
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Product Name</label>
                <input type="text" name="name" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; font-family: var(--font-body); box-sizing: border-box; border-radius: 4px;">
            </div>
            
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Description</label>
                <textarea name="description" rows="5" style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; font-family: var(--font-body); box-sizing: border-box; border-radius: 4px;"></textarea>
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <div style="flex: 1;">
                    <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Price (₹)</label>
                    <input type="number" step="0.01" name="price" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; font-family: var(--font-body); box-sizing: border-box; border-radius: 4px;">
                </div>
                <div style="flex: 1;">
                    <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Discount (%)</label>
                    <input type="number" step="0.1" name="discount" value="0" style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; font-family: var(--font-body); box-sizing: border-box; border-radius: 4px;">
                </div>
            </div>
            
            <div style="border-top: 1px solid var(--border-color); margin-top: 1rem; padding-top: 1.5rem;">
                <h4 style="margin-bottom: 1rem;">Product Images (Up to 5)</h4>
                
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem;">
                    <div style="background: var(--color-cream); padding: 1rem; border-radius: 4px; border: 1px dashed var(--color-primary);">
                        <label style="font-size: 0.9rem; font-weight: bold; display: block; margin-bottom: 0.5rem;">Primary Image *</label>
                        <input type="file" name="image_1" accept="image/*" style="width: 100%;" required>
                    </div>
                    <div style="background: #fafafa; padding: 1rem; border-radius: 4px; border: 1px dashed #ccc;">
                        <label style="font-size: 0.9rem; display: block; margin-bottom: 0.5rem;">Image 2</label>
                        <input type="file" name="image_2" accept="image/*" style="width: 100%;">
                    </div>
                    <div style="background: #fafafa; padding: 1rem; border-radius: 4px; border: 1px dashed #ccc;">
                        <label style="font-size: 0.9rem; display: block; margin-bottom: 0.5rem;">Image 3</label>
                        <input type="file" name="image_3" accept="image/*" style="width: 100%;">
                    </div>
                    <div style="background: #fafafa; padding: 1rem; border-radius: 4px; border: 1px dashed #ccc;">
                        <label style="font-size: 0.9rem; display: block; margin-bottom: 0.5rem;">Image 4</label>
                        <input type="file" name="image_4" accept="image/*" style="width: 100%;">
                    </div>
                    <div style="background: #fafafa; padding: 1rem; border-radius: 4px; border: 1px dashed #ccc;">
                        <label style="font-size: 0.9rem; display: block; margin-bottom: 0.5rem;">Image 5</label>
                        <input type="file" name="image_5" accept="image/*" style="width: 100%;">
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn-solid-primary" style="margin-top: 1rem; padding: 1rem;">Publish Product</button>
        </form>
    </div>
</div>
{% endblock %}
